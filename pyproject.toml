[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tai42-channel-twilio"
version = "0.2.1"
description = "Twilio SMS/WhatsApp channel plugin for the TAI ecosystem — delivers ask_user questions to a human's phone and bridges the reply back."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "tai42", email = "oss@tai42.ai" },
]
keywords = ["mcp", "channel", "twilio", "sms", "whatsapp", "hitl", "tai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    # The pure interface contract — Channel/ChannelDelivery/ChannelDeliveryError
    # and the tai42_app handle the plugin registers through.
    "tai42-contract>=0.2,<0.3",
    # HttpxClient (pooled outbound HTTP), RedisClient (correlation store),
    # TaiBaseSettings + the settings cache registry. [redis] pulls redis-py.
    "tai42-kit[redis]>=0.2,<0.3",
    # Imported directly (transport error types + Basic-auth request building).
    "httpx>=0.28",
    # Imported directly by inbound.py (Request/Response handler types).
    "starlette>=0.40",
    # SecretStr for the auth token and the settings base/config.
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
]

[project.urls]
Homepage = "https://tai42.ai"
Repository = "https://github.com/tai42ai/tai-channel-twilio"
Issues = "https://github.com/tai42ai/tai-channel-twilio/issues"
Changelog = "https://github.com/tai42ai/tai-channel-twilio/blob/main/CHANGELOG.md"

[dependency-groups]
# PEP 735 dev group — installed by default on `uv sync`, so the gate
# `uv sync && uv run pytest && uv run ruff check . && uv run pyright` runs clean.
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.3",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright>=1.1.389",
    # The plugin-spec test parses tai-plugin.yml.
    "pyyaml>=6",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["tai42_channel_twilio*"]

[tool.setuptools.package-data]
tai42_channel_twilio = ["py.typed", "tai-plugin.yml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
xfail_strict = true
# Turn warnings into errors so a real defect that only surfaces as a warning
# (e.g. a missing await -> "coroutine was never awaited") fails the suite loudly
# instead of passing green.
filterwarnings = ["error"]
markers = [
    "integration: live Twilio API tests — run only when CHANNEL_TWILIO_* credentials are present",
]

[tool.coverage.run]
source = ["tai42_channel_twilio"]

[tool.coverage.report]
fail_under = 97

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }]


# The version floors in [project] are the compatibility contract; these path
# sources point local development at the sibling checkouts instead of the
# published packages. They are not part of wheel metadata.
[tool.uv.sources]
tai42-contract = { path = "../tai-contract", editable = true }
tai42-kit = { path = "../tai-kit", editable = true }
[tool.ruff]
src = ["src"]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PIE", "PT", "RUF", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"tai42_skeleton".msg = "A channel plugin sits below the skeleton: it never imports tai42-skeleton."

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
