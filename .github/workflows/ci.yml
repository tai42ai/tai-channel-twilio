name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tai-channel-twilio
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: tai-channel-twilio
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ github.repository_owner }}/tai-contract
          path: tai-contract
          token: ${{ secrets.TAI_CI_TOKEN }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ github.repository_owner }}/tai-kit
          path: tai-kit
          token: ${{ secrets.TAI_CI_TOKEN }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.11.26"
          enable-cache: true
      - run: uv python install 3.13
      # The dev dependency-group (PEP 735, installed by default) carries the
      # test/lint tooling. --locked asserts the committed uv.lock is current;
      # --python pins the interpreter.
      - run: uv sync --locked --python 3.13
      - name: Ruff
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing
      - name: Packaged descriptor
        # The wheel is what users install, so build it and assert the plugin
        # descriptor really travels inside it -- at the import path the loader
        # reads, declaring the same version as the project metadata.
        run: |
          set -euo pipefail
          uv build --wheel --out-dir dist
          wheel=$(ls dist/*.whl)
          version=$(uv run --no-sync python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          descriptor=$(unzip -p "$wheel" tai42_channel_twilio/tai-plugin.yml) || {
            echo "::error::$wheel does not package tai42_channel_twilio/tai-plugin.yml"
            unzip -l "$wheel"
            exit 1
          }
          printf '%s\n' "$descriptor" | grep -qx "version: $version" || {
            echo "::error::$wheel packages a tai-plugin.yml that does not declare version: $version"
            printf '%s\n' "$descriptor"
            exit 1
          }

  # Fleet e2e gate. On push:main and on pull_request, after this repo's own
  # checks pass, dispatch tai-e2e for the tested sha; tai-e2e runs the cross-repo
  # suite and posts a `fleet-e2e` commit status back, which branch protection
  # requires. The dispatch token is a repo Actions secret AND a Dependabot secret
  # so Dependabot PRs dispatch too; a fork PR has neither, so the guarded step
  # skips and the required status stays unset for a maintainer to run.
  trigger-e2e:
    needs: check
    runs-on: ubuntu-latest
    permissions: {}
    env:
      E2E_DISPATCH_TOKEN: ${{ secrets.TAI_E2E_DISPATCH_TOKEN }}
    steps:
      # Build the payload with jq so the branch name (untrusted) is JSON-escaped,
      # never interpolated into a shell or into the payload text.
      - name: Build dispatch payload
        id: payload
        if: env.E2E_DISPATCH_TOKEN != ''
        env:
          SRC_REPO: tai-channel-twilio
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REF_NAME: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          LEGS: "arq"
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg repo "$SRC_REPO" \
            --arg ref "$SHA" \
            --arg ref_name "$REF_NAME" \
            --arg legs "$LEGS" \
            '{repo: $repo, ref: $ref, ref_name: $ref_name} + (if $legs == "" then {} else {legs: $legs} end)')"
          echo "json=$payload" >> "$GITHUB_OUTPUT"
      - name: Dispatch fleet-e2e
        if: env.E2E_DISPATCH_TOKEN != ''
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ env.E2E_DISPATCH_TOKEN }}
          repository: ${{ github.repository_owner }}/tai-e2e
          event-type: fleet-e2e
          client-payload: ${{ steps.payload.outputs.json }}
